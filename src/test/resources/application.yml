server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1jaS10ZXN0LW11c3QtYmUtbG9uZy1lbm91Z2gtZm9yLWhtYWMtc2hhMjU2
  access-token-validity: 3600
  refresh-token-validity: 1209600


ai:
  server:
    base-url: http://localhost:8000
    internal-api-key: "local-dev-secret"